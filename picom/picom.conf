# Прозрачность активного (фокусного) окна (85%)
active-opacity = 0.85;

# Прозрачность неактивных окон на заднем плане (85%)
inactive-opacity = 0.85;

# Настройка размытия (blur), чтобы текст на заднем плане не сливался
blur: {
  method = "dual_kawase";
  strength = 3;
};

# Исключения из размытия (чтобы полноэкранные окна не размывали фон под собой)
blur-background-exclude = [
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# Исключения для фокуса (чтобы полноэкранные окна всегда считались активными)
focus-exclude = [
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# Исключения (какие приложения НЕ должны быть прозрачными)
opacity-rule = [
  "100:class_g = 'Firefox'",
  "100:class_g = 'chromium'",
  "100:class_g = 'mpv'",
  "100:_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# Использовать ускорение видеокарты для плавной работы
backend = "glx";
vsync = true;
